- hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Ensure python is installed
      raw: |
        command -v python3 >/dev/null || (
          dnf -y install python3 ||
          apt-get update && apt-get -y install python3
        )

    - name: Gather facts after python exists
      setup:

    - name: Create ansible user
      user:
        name: ansible
        shell: /bin/bash
        create_home: yes

    - name: Add SSH key for ansible user
      authorized_key:
        user: ansible
        key: "{{ lookup('file', inventory_dir  + '/../secrets/ansible_lab_key.pub') }}"

    - name: Allow ansible passwordless sudo
      copy:
        dest: /etc/sudoers.d/ansible
        content: "ansible ALL=(ALL) NOPASSWD:ALL"
        mode: 0440
        validate: 'visudo -cf %s'
